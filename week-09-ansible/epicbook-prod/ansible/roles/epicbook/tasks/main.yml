---
# ---------- Node.js ----------
- name: Download the NodeSource setup script
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/setup_18.x
    dest: /tmp/nodesource_setup.sh
    mode: "0755"

- name: Add the NodeSource repository
  ansible.builtin.command: bash /tmp/nodesource_setup.sh
  args:
    creates: /usr/bin/node

- name: Install Node.js and npm
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

# ---------- Application code ----------
- name: Ensure the application directory exists
  ansible.builtin.file:
    path: "{{ app_dest }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Clone the EpicBook repository
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dest }}"
    version: main
    force: true

- name: Install Node.js dependencies
  community.general.npm:
    path: "{{ app_dest }}"
    state: present

# ---------- Database ----------
- name: Check whether the database schema is already imported
  ansible.builtin.command: >
    mysql -h {{ db_host }} -u {{ db_user }} -p{{ db_password }} {{ db_name }}
    -e "SHOW TABLES;"
  register: epicbook_db_tables
  changed_when: false
  no_log: true

- name: Import the EpicBook SQL files (schema first, then seed data)
  ansible.builtin.shell: |
    for f in BuyTheBook_Schema.sql author_seed.sql books_seed.sql; do
      mysql -h {{ db_host }} -u {{ db_user }} -p'{{ db_password }}' {{ db_name }} < "{{ app_dest }}/db/$f" || exit 1
    done
  args:
    executable: /bin/bash
  when: epicbook_db_tables.stdout == ""
  no_log: true

# ---------- PM2 ----------
- name: Install PM2 globally
  community.general.npm:
    name: pm2
    global: true
    state: present

- name: Check whether EpicBook is already running in PM2
  ansible.builtin.command: pm2 describe {{ pm2_app_name }}
  register: pm2_describe
  changed_when: false
  failed_when: false

- name: Remove the existing PM2 process so the current environment applies
  ansible.builtin.command: pm2 delete {{ pm2_app_name }}
  when: pm2_describe.rc == 0

- name: Start EpicBook with PM2 on the application port
  ansible.builtin.command: pm2 start server.js --name {{ pm2_app_name }}
  args:
    chdir: "{{ app_dest }}"
  environment:
    PORT: "{{ app_port }}"
    NODE_ENV: production
    JAWSDB_URL: "mysql://{{ db_user }}:{{ db_password }}@{{ db_host }}:3306/{{ db_name }}"
  no_log: true

- name: Register PM2 to start on boot
  ansible.builtin.command: pm2 startup systemd -u root --hp /root
  args:
    creates: /etc/systemd/system/pm2-root.service

- name: Save the PM2 process list
  ansible.builtin.command: pm2 save
  changed_when: false
